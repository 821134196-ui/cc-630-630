# ===== 企业会议纪要保密分发系统 =====
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.application.name=meeting-minutes
quarkus.log.level=INFO
quarkus.log.category."com.enterprise.minutes".level=DEBUG

# 本地数据目录（SQLite 数据库 + 附件 + 上传临时区）
app.data-dir=${user.dir}/data
quarkus.http.body.uploads-directory=${app.data-dir}/tmp
quarkus.http.body.handle-file-uploads=true
quarkus.http.limits.max-body-size=50M

# SQLite（未列入 Quarkus 内置数据库：自定义 db-kind + 显式驱动与 Hibernate 社区方言）
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${app.data-dir}/minutes.db?busy_timeout=10000
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=5
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=update

# 测试环境：SQLite 内存库，单连接
%test.quarkus.datasource.db-kind=sqlite
%test.quarkus.datasource.jdbc.url=jdbc:sqlite::memory:
%test.quarkus.datasource.jdbc.min-size=1
%test.quarkus.datasource.jdbc.max-size=1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.http.test-port=8081
