# HTTP
quarkus.http.port=8080

# Datasource (SQLite)
app.data-dir=${user.dir}/data
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:${app.data-dir}/minutes.db?foreign_keys=true&journal_mode=WAL
quarkus.datasource.jdbc.max-size=1
# SQLite 同一时刻只允许一个写连接；单连接也避免 SQLITE_BUSY_SNAPSHOT
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.transaction-isolation-level=READ_UNCOMMITTED

# Hibernate ORM
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# File uploads
quarkus.http.limits.max-body-size=50M

# Simulated mail
app.base-url=http://localhost:8080
app.mail-dir=${app.data-dir}/mail

# Test profile overrides
%test.quarkus.http.port=8081
%test.app.data-dir=${user.dir}/target/test-data
